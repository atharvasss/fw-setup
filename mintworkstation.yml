```yaml
# ============================================================
# LINUX MINT WORKSTATION
# ============================================================
#
# Linux Mint DevOps workstation for:
# - Linux administration
# - Networking
# - Git / SSH
# - Containers
# - Cloud / IaC
# - Kubernetes
# - Ansible
#
# Install:
#   sudo apt update
#   sudo apt install -y ansible
#   ansible-galaxy collection install community.general
#
# Check:
#   ansible-playbook workstation.yml --ask-become-pass --check
#
# Run:
#   ansible-playbook workstation.yml --ask-become-pass
#
# ============================================================
# MANUAL INSTALL — NOT HANDLED BY THIS PLAYBOOK
# ============================================================
#
# Install manually:
#
#   - Terraform
#   - OpenTofu
#   - Kind
#   - K9s
#   - Trivy
#   - Kubectl
#   - Helm
#   - AWS CLI
#
# ============================================================

---

- name: Configure Linux Mint DevOps Workstation
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:

    # ========================================================
    # USER
    # ========================================================

    workstation_user: "{{ ansible_user_id }}"
    workstation_home: "{{ ansible_env.HOME }}"
    workstation_uid: "{{ ansible_user_uid }}"
    workstation_runtime_dir: "/run/user/{{ workstation_uid }}"


    # ========================================================
    # APT PACKAGES
    # ========================================================

    apt_packages:

      # ------------------------------------------------------
      # Desktop
      # ------------------------------------------------------

      - gnome-tweaks
      - toolbox


      # ------------------------------------------------------
      # Containers
      # ------------------------------------------------------

      - podman
      - podman-docker
      - podman-compose
      - skopeo
      - buildah


      # ------------------------------------------------------
      # Backup / Filesystem
      # ------------------------------------------------------

      - deja-dup
      - restic
      - fuse3


      # ------------------------------------------------------
      # System
      # ------------------------------------------------------

      - libnotify-bin
      - gvfs
      - accountsservice
      - flatpak


      # ------------------------------------------------------
      # General CLI
      # ------------------------------------------------------

      - tldr
      - tree
      - tmux
      - jq
      - yq
      - ripgrep
      - shfmt
      - curl
      - wget
      - vim
      - ncdu
      - btop


      # ------------------------------------------------------
      # Git / SSH
      # ------------------------------------------------------

      - git
      - openssh-client


      # ------------------------------------------------------
      # Troubleshooting
      # ------------------------------------------------------

      - shellcheck
      - strace
      - stress-ng
      - lsof
      - sysstat


      # ------------------------------------------------------
      # Networking
      # ------------------------------------------------------

      - iperf3
      - mtr
      - tcpdump
      - dnsutils
      - netcat-openbsd


      # ------------------------------------------------------
      # Automation
      # ------------------------------------------------------

      - ansible


    # ========================================================
    # FLATPAK APPLICATIONS
    # ========================================================

    flatpak_apps:

      - org.gnome.Ptyxis
      - app.zen_browser.zen
      - com.github.flxzt.rnote
      - com.github.tchx84.Flatseal
      - com.mattjakeman.ExtensionManager
      - com.spotify.Client
      - io.podman_desktop.PodmanDesktop
      - org.mozilla.Thunderbird
      - org.onlyoffice.desktopeditors
      - org.videolan.VLC


  tasks:

    # ========================================================
    # SYSTEM
    # ========================================================

    - name: Update APT metadata
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600


    # ========================================================
    # PACKAGES
    # ========================================================

    - name: Install workstation packages
      ansible.builtin.apt:
        name: "{{ apt_packages }}"
        state: present


    # ========================================================
    # PODMAN
    # ========================================================

    - name: Enable rootless Podman socket
      become: false
      ansible.builtin.systemd:
        name: podman.socket
        scope: user
        state: started
        enabled: true
      environment:
        XDG_RUNTIME_DIR: "{{ workstation_runtime_dir }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path={{ workstation_runtime_dir }}/bus"

    - name: Configure Docker API compatibility
      become: false
      ansible.builtin.lineinfile:
        path: "{{ workstation_home }}/.bashrc"
        regexp: '^export DOCKER_HOST='
        line: 'export DOCKER_HOST="unix:///run/user/$(id -u)/podman/podman.sock"'
        state: present


    # ========================================================
    # FLATHUB
    # ========================================================

    - name: Configure Flathub
      become: false
      community.general.flatpak_remote:
        name: flathub
        state: present
        flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
        method: user


    # ========================================================
    # FLATPAK
    # ========================================================

    - name: Install Flatpak applications
      become: false
      community.general.flatpak:
        name: "{{ flatpak_apps }}"
        remote: flathub
        state: present
        method: user


```

# ============================================================
# LINUX MINT WORKSTATION
# ============================================================
#
# Fedora → Linux Mint conversion:
#   dnf  → apt
#
# ============================================================
# MANUAL INSTALL — NOT HANDLED BY THIS PLAYBOOK
# ============================================================
#
# The following tools are intentionally NOT installed by
# Ansible because they may not be available/reliable through
# the default Linux Mint packages.
#
# Install these manually:
#
#   1. OpenTofu
#   2. Kind
#   3. K9s
#   4. Trivy
#   5. terraform
#
# ------------------------------------------------------------
#
# Everything else required by this playbook is handled by
# APT or Flatpak.
#
# ============================================================
#
# Install Ansible:
#   sudo apt update
#   sudo apt install -y ansible
#
# Install required Ansible collection:
#   ansible-galaxy collection install community.general
#
# Check:
#   ansible-playbook workstation.yml --ask-become-pass --check
#
# Run:
#   ansible-playbook workstation.yml --ask-become-pass
#
# ============================================================


---

- name: Configure Linux Mint DevOps Workstation
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:

    # ========================================================
    # USER
    # ========================================================

    workstation_user: >-
      {{ lookup('env', 'SUDO_USER') |
         default(lookup('env', 'USER'), true) }}

    workstation_uid: >-
      {{ lookup('pipe', 'id -u ' ~ workstation_user) }}

    workstation_runtime_dir: "/run/user/{{ workstation_uid }}"


    # ========================================================
    # APT PACKAGES
    # ========================================================

    apt_packages:

      # ------------------------------------------------------
      # Desktop
      # ------------------------------------------------------

      - ptyxis
      - gnome-tweaks
      - toolbox


      # ------------------------------------------------------
      # Containers
      # ------------------------------------------------------

      - podman
      - podman-docker
      - podman-compose
      - skopeo
      - buildah


      # ------------------------------------------------------
      # Backup / Filesystem
      # ------------------------------------------------------

      - deja-dup
      - restic
      - fuse3


      # ------------------------------------------------------
      # System
      # ------------------------------------------------------

      - libnotify-bin
      - gvfs
      - accountsservice
      - flatpak


      # ------------------------------------------------------
      # General CLI
      # ------------------------------------------------------

      - tldr
      - tree
      - tmux
      - jq
      - yq
      - ripgrep
      - shfmt
      - curl
      - wget
      - vim
      - ncdu
      - btop


      # ------------------------------------------------------
      # Git / SSH
      # ------------------------------------------------------

      - git
      - openssh-client


      # ------------------------------------------------------
      # Troubleshooting
      # ------------------------------------------------------

      - shellcheck
      - strace
      - stress-ng
      - lsof
      - sysstat


      # ------------------------------------------------------
      # Networking
      # ------------------------------------------------------

      - iperf3
      - mtr
      - tcpdump
      - dnsutils
      - netcat-openbsd


      # ------------------------------------------------------
      # Cloud
      # ------------------------------------------------------

      - awscli


      # ------------------------------------------------------
      # Kubernetes
      # ------------------------------------------------------

      - kubectl
      - helm


      # ------------------------------------------------------
      # Automation
      # ------------------------------------------------------

      - ansible


    # ========================================================
    # FLATPAK APPLICATIONS
    # ========================================================

    flatpak_apps:

      - app.zen_browser.zen
      - com.github.flxzt.rnote
      - com.github.tchx84.Flatseal
      - com.mattjakeman.ExtensionManager
      - com.spotify.Client
      - io.podman_desktop.PodmanDesktop
      - org.mozilla.Thunderbird
      - org.onlyoffice.desktopeditors
      - org.videolan.VLC


  tasks:

    # ========================================================
    # SYSTEM
    # ========================================================

    - name: Update APT metadata
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600


    # ========================================================
    # PACKAGES
    # ========================================================

    - name: Install workstation packages
      ansible.builtin.apt:
        name: "{{ apt_packages }}"
        state: present


    # ========================================================
    # PODMAN
    # ========================================================

    - name: Enable rootless Podman socket
      become: false
      ansible.builtin.systemd:
        name: podman.socket
        scope: user
        state: started
        enabled: true
      environment:
        XDG_RUNTIME_DIR: "{{ workstation_runtime_dir }}"
        DBUS_SESSION_BUS_ADDRESS: >-
          unix:path={{ workstation_runtime_dir }}/bus

    # Keep Docker-compatible clients pointed at rootless Podman.
    # This does NOT expose Podman over TCP.
    - name: Configure Docker API compatibility
      become: false
      ansible.builtin.lineinfile:
        path: "{{ lookup('env', 'HOME') }}/.bashrc"
        regexp: '^export DOCKER_HOST='
        line: 'export DOCKER_HOST="unix://$XDG_RUNTIME_DIR/podman/podman.sock"'
        state: present


    # ========================================================
    # FLATHUB
    # ========================================================

    - name: Configure Flathub
      become: false
      community.general.flatpak_remote:
        name: flathub
        state: present
        flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
        method: user


    # ========================================================
    # FLATPAK
    # ========================================================

    - name: Install Flatpak applications
      become: false
      community.general.flatpak:
        name: "{{ flatpak_apps }}"
        remote: flathub
        state: present
        method: user

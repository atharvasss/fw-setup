# ============================================================
# FEDORA DEVOPS / SRE WORKSTATION
# ============================================================
#
# Fedora host configuration for:
# - Linux administration
# - System troubleshooting
# - Networking
# - Git / SSH
# - Containers
# - Toolbox / Distrobox
# - Desktop applications
#
# Cloud / Kubernetes / IaC CLIs such as:
# AWS CLI, Azure CLI, gcloud, Terraform, kubectl,
# Helm, kind, k9s, etc. should be installed inside
# Toolbox / Distrobox environments.
#
# Install:
#   sudo dnf install ansible-core
#   ansible-galaxy collection install community.general
#
# Run:
#   ansible-playbook workstation.yml --ask-become-pass
#
# Check:
#   ansible-playbook workstation.yml --ask-become-pass --check
#
# ============================================================

---

- name: Configure Fedora DevOps SRE Workstation
  hosts: localhost
  connection: local
  become: true

  vars:

    # ========================================================
    # DNF PACKAGES
    # ========================================================

    dnf_packages:

      # ------------------------------------------------------
      # Desktop
      # ------------------------------------------------------

      - ptyxis
      - gnome-tweaks
      - distrobox
      - toolbox

      # ------------------------------------------------------
      # Containers
      # ------------------------------------------------------

      - podman
      - podman-docker
      - podman-compose

      # ------------------------------------------------------
      # Backup / Filesystem
      # ------------------------------------------------------

      - deja-dup
      - restic
      - fuse3

      # ------------------------------------------------------
      # System
      # ------------------------------------------------------

      - libnotify
      - gvfs-goa
      - accountsservice

      # ------------------------------------------------------
      # General CLI
      # ------------------------------------------------------

      - tldr
      - tree
      - tmux
      - jq
      - yq
      - ripgrep
      - shfmt

      # ------------------------------------------------------
      # Git / SSH
      # ------------------------------------------------------

      - git
      - openssh-clients

      # ------------------------------------------------------
      # Linux Troubleshooting
      # ------------------------------------------------------

      - shellcheck
      - strace
      - stress-ng
      - lsof
      - sysstat

      # ------------------------------------------------------
      # Networking
      # ------------------------------------------------------

      - iperf3
      - mtr

    # ========================================================
    # FLATPAK APPLICATIONS
    # ========================================================

    flatpak_apps:

      - app.zen_browser.zen
      - com.github.flxzt.rnote
      - com.github.tchx84.Flatseal
      - com.mattjakeman.ExtensionManager
      - com.spotify.Client
      - io.podman_desktop.PodmanDesktop
      - org.mozilla.thunderbird_esr
      - org.onlyoffice.desktopeditors
      - org.videolan.VLC

  tasks:

    # ========================================================
    # SYSTEM
    # ========================================================

    - name: Update DNF metadata
      ansible.builtin.dnf:
        update_cache: true

    # ========================================================
    # PACKAGES
    # ========================================================

    - name: Install Fedora host packages
      ansible.builtin.dnf:
        name: "{{ dnf_packages }}"
        state: present

    # ========================================================
    # PODMAN
    # ========================================================

    - name: Enable Podman socket
      become: false
      ansible.builtin.systemd:
        name: podman.socket
        scope: user
        state: started
        enabled: true

    - name: Configure Docker compatibility
      become: false
      ansible.builtin.lineinfile:
        path: "{{ lookup('env', 'HOME') }}/.bashrc"
        line: 'export DOCKER_HOST="unix://$XDG_RUNTIME_DIR/podman/podman.sock"'
        regexp: '^export DOCKER_HOST='
        state: present

    # ========================================================
    # FLATHUB
    # ========================================================

    - name: Check Flathub
      become: false
      ansible.builtin.command:
        cmd: flatpak remotes --user
      register: flatpak_remotes
      changed_when: false

    - name: Add Flathub
      become: false
      ansible.builtin.command:
        cmd: >
          flatpak remote-add
          --if-not-exists
          flathub
          https://dl.flathub.org/repo/flathub.flatpakrepo
      when: "'flathub' not in flatpak_remotes.stdout"

    # ========================================================
    # FLATPAK APPLICATIONS
    # ========================================================

    - name: Install Flatpak applications
      become: false
      community.general.flatpak:
        name: "{{ flatpak_apps }}"
        remote: flathub
        state: present
